name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Test workspace with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --locked --all-targets
      - name: Test Signal-free CLI configuration
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked -p opencsv-cli --no-default-features --all-targets
      - name: Check opt-in issuer tooling
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p opencsv-ffi --features issuer-tools --example signet_account_acceptance
      - name: Verify reproducible reference binaries
        run: ./scripts/reproducible-build.sh --verify dist/reproducible
