name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - name: Format and check
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo fmt --check
          cargo check --workspace --locked --all-targets

  rust:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
      - name: Test workspace with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --workspace --locked --all-targets
      - name: Check D5 profile spike feature
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked -p opencsv-pcd --features d5-profile-spike --all-targets --no-run
      - name: Test Signal-free CLI configuration
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked -p opencsv-cli --no-default-features --all-targets
      - name: Check opt-in Signal CLI configuration
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo check --locked -p opencsv-cli --features signal
          cargo test --locked -p opencsv-cli --features signal --no-run
      - name: Test opt-in wallet recovery feature
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --locked -p opencsv-ffi --lib --features test-wallet-recovery
      - name: Verify recovery and issuer symbols are feature-gated
        run: |
          cargo build --locked --release -p opencsv-ffi
          nm -g target/release/libopencsv_ffi.a > target/release/opencsv-default-symbols.txt
          if grep -q opencsv_account_rebind_test_device target/release/opencsv-default-symbols.txt; then
            echo "test rebind symbol leaked into the default release build" >&2
            exit 1
          fi
          if grep -Eq 'opencsv_wallet_init_issuer|opencsv_prove_mint' target/release/opencsv-default-symbols.txt; then
            echo "issuer symbol leaked into the default Signal release build" >&2
            exit 1
          fi
          cargo build --locked --release -p opencsv-ffi --features test-wallet-recovery
          nm -g target/release/libopencsv_ffi.a | grep -q opencsv_account_rebind_test_device
      - name: Check opt-in issuer tooling
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --locked -p opencsv-ffi --features issuer-tools --tests
          cargo check --locked -p opencsv-ffi --features issuer-tools --bin opencsv-issuer --examples
          cargo build --locked --release -p opencsv-ffi --features issuer-tools
          nm -g target/release/libopencsv_ffi.a | grep -q opencsv_wallet_init_issuer
          nm -g target/release/libopencsv_ffi.a | grep -q opencsv_prove_mint
      - name: Check secret-free production registry tooling
        env:
          RUSTFLAGS: -D warnings
          CARGO_TARGET_DIR: target/registry-tools
        run: |
          cargo test --locked -p opencsv-ffi --features registry-tools --bin opencsv-registry
          cargo build --locked --release -p opencsv-ffi --features registry-tools --lib --bin opencsv-registry
          nm -g target/registry-tools/release/libopencsv_ffi.a > target/registry-tools/release/opencsv-registry-symbols.txt
          if grep -Eq 'opencsv_wallet_init_issuer|opencsv_prove_mint' target/registry-tools/release/opencsv-registry-symbols.txt; then
            echo "issuer symbol leaked into the registry-only build" >&2
            exit 1
          fi
      - name: Verify reproducible reference binaries
        run: ./scripts/reproducible-build.sh --verify dist/reproducible
