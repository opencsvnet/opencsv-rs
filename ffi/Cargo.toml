[package]
name = "opencsv-ffi"
description = "C ABI for embedding the OpenCSV wallet in native apps (iOS-first): prove, verify, balance, audit over an anchor-snapshot view"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# DEBUG-only simulator/device recovery facility. Production Signal builds do
# not enable this feature, so the rebind C symbol is absent from their binary.
test-wallet-recovery = []
# Privileged issuer/reference tooling. Signal's CocoaPods build does not enable
# this feature, and the C ABI intentionally exposes no corresponding symbols.
issuer-tools = ["dep:clap"]

[[bin]]
name = "opencsv-issuer"
path = "src/bin/opencsv-issuer.rs"
required-features = ["issuer-tools"]

[[example]]
name = "signet_account_acceptance"
required-features = ["issuer-tools"]

[[example]]
name = "zero_conf_simulator_fixture"
required-features = ["issuer-tools"]

[[test]]
name = "export_snapshot"
required-features = ["issuer-tools"]

[[test]]
name = "pending_crosscheck"
required-features = ["issuer-tools"]

[[test]]
name = "roundtrip"
required-features = ["issuer-tools"]

[[test]]
name = "scan_e2e"
required-features = ["issuer-tools"]

[dependencies]
opencsv-core = { path = "../crates/opencsv-core" }
opencsv-pcd = { path = "../crates/opencsv-pcd" }
opencsv-bitcoin = { path = "../crates/opencsv-bitcoin" }
opencsv-cbf = { path = "../crates/opencsv-cbf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
base64 = "0.22"
p3-baby-bear = "0.6.3"
bdk_wallet = "=3.1.0"
bdk_esplora = { version = "=0.22.2", default-features = false, features = ["std", "blocking-https-rustls"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
rusqlite = "=0.38.0"
zeroize = "=1.9.0"
url = "=2.5.8"
clap = { version = "4", features = ["derive", "env"], optional = true }

[dev-dependencies]
tempfile = "3"
