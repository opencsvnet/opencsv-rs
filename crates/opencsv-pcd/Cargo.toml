[package]
name = "opencsv-pcd"
description = "Proof-carrying data circuits for OpenCSV (stage 1: coin commitment opening; stage 2: mint/transfer predicates)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Isolated, ignored desktop harness for deriving the value-free v5 profile.
# Production/default builds never install or consult a measured profile.
d5-profile-spike = []

[dependencies]
opencsv-core = { path = "../opencsv-core" }
hashbrown = "0.17.1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
sha2 = "0.10"
p3-air = "0.6.3"
p3-baby-bear = "0.6.3"
p3-batch-stark = "0.6.3"
p3-challenger = "0.6.3"
p3-commit = "0.6.3"
p3-dft = "0.6.3"
p3-field = "0.6.3"
p3-fri = "0.6.3"
p3-lookup = "0.6.3"
p3-matrix = "0.6.3"
p3-merkle-tree = "0.6.3"
p3-symmetric = "0.6.3"
p3-uni-stark = "0.6.3"
p3-util = "0.6.3"
# Recursion/circuit stack: OpenCSV's minimal fork of the official
# Plonky3-recursion repo, pinned to the merged predecessor-vk accessor and
# F1 const-value-binding patches.
# The crates.io `p3-recursion 0.1.0` is a stub — do not use it.
# Reviewed merge of the D5 value-free shape, monotone profile closure, NPO
# padding, and empty-preprocessed dummy synthesis work (PRs #2 and #3).
p3-circuit = { git = "https://github.com/opencsvnet/Plonky3-recursion.git", rev = "28c9a37f31a7f69877a62cb372ddffce1f3f8189" }
p3-circuit-prover = { git = "https://github.com/opencsvnet/Plonky3-recursion.git", rev = "28c9a37f31a7f69877a62cb372ddffce1f3f8189" }
p3-poseidon2-circuit-air = { git = "https://github.com/opencsvnet/Plonky3-recursion.git", rev = "28c9a37f31a7f69877a62cb372ddffce1f3f8189" }
p3-recursion = { git = "https://github.com/opencsvnet/Plonky3-recursion.git", rev = "28c9a37f31a7f69877a62cb372ddffce1f3f8189" }
