[package]
name = "opencsv-pcd"
description = "Proof-carrying data circuits for OpenCSV (stage 1: coin commitment opening; stage 2: mint/transfer predicates)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencsv-core = { path = "../opencsv-core" }
hashbrown = "0.17.1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
sha2 = "0.10"
p3-air = "0.6.3"
p3-baby-bear = "0.6.3"
p3-batch-stark = "0.6.3"
p3-challenger = "0.6.3"
p3-commit = "0.6.3"
p3-dft = "0.6.3"
p3-field = "0.6.3"
p3-fri = "0.6.3"
p3-lookup = "0.6.3"
p3-matrix = "0.6.3"
p3-merkle-tree = "0.6.3"
p3-symmetric = "0.6.3"
p3-uni-stark = "0.6.3"
p3-util = "0.6.3"
# Recursion/circuit stack: OpenCSV's minimal fork of the official
# Plonky3-recursion repo, pinned to the predecessor-vk accessor patch.
# The crates.io `p3-recursion 0.1.0` is a stub — do not use it.
# Pin: d6510eb629097d733d631e8e833fc962025f25f5 (one accessor commit over
# official b36339709a7a67ee9760fb578b3d4339fd983709; tracks p3 0.6).
p3-circuit = { git = "https://github.com/opencsvnet/Plonky3-recursion.git", rev = "d6510eb629097d733d631e8e833fc962025f25f5" }
p3-circuit-prover = { git = "https://github.com/opencsvnet/Plonky3-recursion.git", rev = "d6510eb629097d733d631e8e833fc962025f25f5" }
p3-poseidon2-circuit-air = { git = "https://github.com/opencsvnet/Plonky3-recursion.git", rev = "d6510eb629097d733d631e8e833fc962025f25f5" }
p3-recursion = { git = "https://github.com/opencsvnet/Plonky3-recursion.git", rev = "d6510eb629097d733d631e8e833fc962025f25f5" }
