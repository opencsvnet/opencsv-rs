[package]
name = "opencsv-cli"
description = "Text wallet client for OpenCSV (transport-agnostic: consignments are opaque blobs read/written as files)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["signal"]
signal = ["dep:opencsv-signal", "dep:tokio", "dep:tracing-subscriber"]

[dependencies]
opencsv-core = { path = "../opencsv-core" }
opencsv-pcd = { path = "../opencsv-pcd" }
opencsv-bitcoin = { path = "../opencsv-bitcoin" }
opencsv-signal = { path = "../opencsv-signal", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
rand = "0.10"
base64 = "0.22"
p3-baby-bear = "0.6.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "opencsv"
path = "src/main.rs"
