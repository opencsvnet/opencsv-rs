[package]
name = "opencsv-bitcoin"
description = "Real bitcoind-RPC anchor chain backend for OpenCSV (signet/mainnet/regtest)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencsv-core = { path = "../opencsv-core" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
# The canonical ctx derivation is SHA-256 so any indexer, in any language,
# recomputes it (see `funding_ctx`).
sha2 = "0.10"
bitcoin = { version = "0.32", features = ["rand-std"] }
rand = "0.10"

[dev-dependencies]
tempfile = "3"
