name: OpenCsvBench
options:
  bundleIdPrefix: net.opencsv
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  OpenCsvBench:
    type: application
    platform: iOS
    sources:
      - path: OpenCsvBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.opencsv.bench
        PRODUCT_NAME: OpenCsvBench
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenCSV Bench
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: OpenCsvBench/OpenCsvBench-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../target/aarch64-apple-ios/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - -lopencsv_bench_ffi
        SUPPORTED_PLATFORMS: iphoneos
        TARGETED_DEVICE_FAMILY: 1
schemes:
  OpenCsvBench:
    build:
      targets:
        OpenCsvBench: all
    run:
      config: Release
