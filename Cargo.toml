[workspace]
resolver = "2"
members = [
    "crates/opencsv-core",
    "crates/opencsv-pcd",
    "crates/opencsv-cli",
    "crates/opencsv-signal",
    "apple/bench-ffi",
    "crates/opencsv-anchor-server",
    "crates/opencsv-bitcoin",
    "ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
